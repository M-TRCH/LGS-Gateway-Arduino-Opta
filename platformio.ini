; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = LGS-Gateway-Arduino-Opta
description = Modbus TCP (port 502) to Modbus RTU (RS485) gateway on Arduino Opta
default_envs = opta

[env:opta]
platform = ststm32
board = opta
framework = arduino
lib_deps =
	arduino-libraries/ArduinoRS485@^1.1.0
	; Network firmware update: stages UPDATE.BIN on the QSPI OTA partition and
	; sets the bootloader's RTC apply-magic. Used for the capability probe and
	; the apply step only — the byte transfer is our own (gw_remote FW subs).
	arduino-libraries/Arduino_Portenta_OTA@^1.2.1
monitor_speed = 115200
